name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Proves the packs still compile and the archive builds. The zip is thrown
      # away -- release.yml is what ships one.
      - name: Build
        run: npm run build
