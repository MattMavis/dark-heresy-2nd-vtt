    size: 6
    faction: ''
    subfaction: ''
    type: Wheeled
    threatLevel: 12
items:
    - _id: Ds1ClHRb8QUuRDzM
      name: Size
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Determines creature size and benefits.
          level: 6
          source: PG 139 CB
    - _id: aY7NvBKYoJcXJUPt
      name: Bike
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The smallest sub-type of vehicles, bikes take many different forms,
              from the iron steeds ridden by the Adeptus Astartes, to the nimble darts of
              the Eldar, right through to the smoke-belching contraptions favoured by the
              Orks. Bikes follow all the standard rules for vehicles and are treated as
              having the Open-Topped trait. However, due to their size and lower profiles,
              in melee characters attacking a vehicle with the Bike trait can choose between
              the rider and the vehicle without needing to make a Called Shot. Bikes are
              usually Wheeled vehicles, but can also be Skimmers or Tracked. They cannot
              make Ram! actions due to their light construction.
          level: 0
          source: PG 187 CB
    - _id: mQeUGBNHK7yU8zfm
      name: Rugged
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Robust power systems, modular armour plates, and redundant fuel
              systems can make a vehicle far easier to repair, saving time and resources
              and allowing the vehicle to be put back into the field far more quickly than
              other designs. All Repair tests made to repair a vehicle with the Rugged
              trait gain a +20 bonus.
          level: 0
          source: PG 189 CB
    - _id: JLc1pO1Z07EOUIlE
      name: Wheeled
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The following rules apply to a Wheeled vehicle. It suffers a -20
              penalty to all tests involving difficult terrain. It gains a +10 bonus on
              all tests involving Manoeuvrability. Wheeled Vehicles are extremely difficult
              to control once they suffer serious damage to their motive systems; the loss
              of even one wheel can make even the most experienced drivers struggle to keep
              the vehicle moving in a straight line, especially in the heat of combat. Vehicles
              with the Wheeled Vehicle trait suffer Motive Systems Critical damage as normal,
              but once any such damage has been taken, all forms of movement require Operate
              tests, and all tests related to the vehicle's Manoeuvrability, are made at
              a -10 penalty. Wheeled mechanisms are generally far less complex than those
              belonging to tracked vehicles. Repairing Critical damage to the vehicle's
              Motive Systems, as well as any lasting Motive System damage (such as Motive
              Systems Damaged, Motive Systems Crippled, etc.) takes half as long as normal
              (see page 259).
          level: 0
          source: PG 189 CB
    - _id: H0M6yic28GLymOCh
      name: Modular Design
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Although normally designed to carry both the driver and two passengers,
              the Aelurus design allows for alternate configurations, enhancing the vehicle's
              flexibility. Some trikes remove the two passenger seats to carry an extra
              200kg of cargo (three times the norm), others replace the cargo area completely
              with a third passenger seat, and those operating in dangerous areas even add
              light weapons such as pintle-mounted linked autoguns.
          level: 0
          source: PG 54 EO
    - _id: KoHEzhwdXaXoGNqL
      name: Twin-Autoguns
      type: weapon
      img: systems/dark-heresy-2nd/icons/items/pistols/pistols_09.png
      system:
          craftsmanship: Common
          availability: Scarce
          weight: 10
          equipped: false
          inBackpack: false
          description: Optional pintle-mounted weapon fitted to some Aelurus Heavy Trikes
              operating in dangerous areas, replacing the third passenger seat.
          source: PG 54 EO
          damage: 1d10+3
          damageType: Impact
          penetration: 0
          special:
              twinLinked: true
          range: 100
