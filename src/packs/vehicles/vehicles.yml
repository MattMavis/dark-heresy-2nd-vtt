    threatLevel: 25
items:
    - _id: gsJusu4s6cqAuvSf
      name: Size
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Determines creature size and benefits.
          level: 8
          source: PG 139 CB
    - _id: tWubSBwYOgYkfTa6
      name: Enclosed
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The greater majority of vehicles are completely enclosed, keeping
              their crew and passengers safe from the outside elements with thick armour,
              bulky hatchways, and heavy glassteel visors. Crew and passengers within an
              Enclosed vehicle cannot attack targets with their own personal weapons unless
              they have some way of getting outside of the vehicle, be it through a hatch,
              doorway, or firing slit. Within an Enclosed vehicle, crew and passengers cannot
              be specifically targeted by those outside the vehicle (unless there is a
              particularly good reason, such as a mind-based psychic attack).
          level: 0
          source: PG 188 CB
    - _id: KCTLizyVyleqviqP
      name: Environmentally Sealed
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The vehicle is sealed off from the outside world completely, allowing
              it to function in almost any environment. It will also have its own life
              support system. Vehicles that become exposed due to Critical damage results
              lose this ability until their armour is repaired. Passengers and crew cannot
              fire their own personal weaponry from a vehicle with the Environmentally
              Sealed trait without first breaching those seals (or if they were already
              breached due to vehicle damage).
          level: 0
          source: PG 188 CB
    - _id: 3wo6t5CLy9OyjN0r
      name: Flyer
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Flyers must move at least their Tactical Speed every turn; a flyer
              moving less than this descends by one level of Altitude at the start of the
              pilot's turn. As a general rule, a flyer can only turn 45 degrees (instead
              of 90 degrees) each time it moves its own length in distance. It can turn
              more than once during a given Movement action, provided it moves a sufficient
              distance each time. Flyers can have their Altitude changed via the Tactical
              Manoeuvring action, altering their Altitude one level higher or lower. Altitudes
              can be increased only when using a Full Action in this way. Flyers ignore
              ground terrain while airborne (except in the case of mountains, hive cities,
              or other exceedingly tall features). Flyers that go Out of Control while
              airborne immediately descend one Altitude level and turn in a three-dimensional
              random direction using the Scatter Diagram on page 230 of the Dark Heresy
              Core Rulebook. This can result in a ground crash. Unless it is already at
              ground level, a flyer that is destroyed automatically crashes. Firing on
              an airborne flyer incurs a -20 penalty to Ballistic Skill tests on top of
              any other penalties. Flyers at High or Orbital Altitudes cannot be targeted
              by ground forces unless a weapon or user has a special ability allowing for
              this. A flyer that crashes for any reason is treated as a skimmer crashing
              from a height of 10 metres or higher, as described on page 256 of the Dark
              Heresy Core Rulebook. NOTE - this vehicle-specific ruling differs from the
              generic creature Flyer trait already in this system's trait pack; see that
              entry's description for the creature version instead.
          level: 0
          source: PG 53 EO
    - _id: KrTHqggNliwRAiGh
      name: Skimmer
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: It moves roughly 2 metres above the ground at all times, in much
              the same way as people and creatures with the Hoverer trait, but can adjust
              that height slightly when moving over ground-based obstacles. Skimmers can
              also move to Low Altitude, as described in the rules for Flying. It ignores
              all forms of difficult terrain (except those deemed appropriate by the GM).
              It gains a +10 bonus on all tests involving Manoeuvrability. A Skimmer is
              not a true aircraft and therefore cannot fly at any significant altitude.
              Nevertheless, a sudden loss in motive power can be catastrophic as it ploughs
              into the ground, often at great speed. Skimmers follow special rules for
              Crashing. It can make use of the Ram! action, but if the Operate test is
              failed, it is treated as having instead Crashed into its target. A Skimmer
              is often far more difficult to hit in melee combat than its ground-based
              counterparts, and thus all Weapon Skill tests made to attack it in melee
              suffer a -10 penalty. It can turn as many times as desired when moving, regardless
              of how far it moves.
          level: 0
          source: PG 189 CB
    - _id: MhDp9kY2uRS66MDM
      name: Aerospace Vehicle
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: An Aquila Lander can reach Orbital Altitude.
          level: 0
          source: PG 55 EO
    - _id: IbS8dzSHzcZzaPcR
      name: Ceramite Hull
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Designed to leave and re-enter the atmosphere very quickly, the
              Aquila's ceramite plating makes it more resistant to heat-based weaponry.
              Attacks made against it with weapons with the Melta quality do not benefit
              from that quality.
          level: 0
          source: PG 55 EO
    - _id: ZlT1xTn8SHQ6dU6p
      name: Autocannon
      type: weapon
      img: systems/dark-heresy-2nd/icons/items/pistols/pistols_09.png
      system:
          craftsmanship: Common
