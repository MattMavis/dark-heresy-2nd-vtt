    - _id: LD5bZHFIWPU7wVJZ
      name: Damage Control
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The vehicle possesses some limited form of self-repair. This could
              be an ancient machine spirit, slaved servitors, quick-growing Eldar Wraithbone,
              or even a team of Ork Grots scurrying across the hull hammering at loose
              armour plates and holding wires together. When a vehicle with the Damage
              Control vehicle trait suffers Critical damage due to Righteous Fury, the
              vehicle's commander (or driver if there is no designated commander) can force
              the 1d5 to be re-rolled. If a vehicle with the Damage Control trait ever
              catches fire, then attempting to put out that fire is a Free Action for whichever
              crewmember or passenger makes the attempt.
          level: 0
          source: PG 188 CB
    - _id: ZR68pdIJ7h2Pz9rH
      name: Walker
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The following rules apply to a vehicle with the Walker trait.
              It is able to ignore many types of difficult terrain due to its sure-footed
              and agile limbs. It treats conditions such as rockslides, tank traps, fallen
              trees, and basic rubble and ruins as open ground. It is up to the GM to determine
              what other types of terrain a walker can ignore. It cannot make use of the
              Ram! action, but if it has a melee weapon, it can make a Charge action (using
              the operator's Weapon Skill) instead. Far more combat capable than most other
              vehicle types, a walker (or rather its pilot) is better able to turn to face
              its opponents in the midst of a melee. It can turn to face its melee opponents
              at the end of its turn as a Free Action (this does not count as a form of
              movement). It should be clear to the GM and the players which direction it
              is facing for the purposes of working out which armour value its opponents
              must attempt to penetrate, as well as which direction the walker may make
              its attacks. It may turn as many times as it likes when moving, regardless
              of how far it moves.
          level: 0
          source: PG 189 CB
    - _id: ErZIZfR7rEqjUgWn
      name: Titanic Behemoth
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Skerab Harvesters dwarf almost everything on a planet's surface,
              each one more akin to a small village than a simple vehicle. Over 500 metres
              across and several stories high, GMs might treat a Skerab Harvester less
              as a vehicle and more as a mobile hab block.
          level: 0
          source: PG 57 EO
    - _id: BsVjdODwyenwQRPM
      name: Unavoidable Attack
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Anything with the ill fortune to end up underneath an active Skerab
              Walker suffers a single automatic hit from its combine harvester array or
              digging shear. Due to the massive scale of the Skerab, a character cannot
              use an Evasion reaction to avoid this hit. If the target is Massive (Size
              7) or larger, the array shuts down after inflicting the hit to avoid damaging
              the blades. It takes the crew an hour of repairs and cleansing rituals to
              restart the blades.
          level: 0
          source: PG 57 EO
    - _id: zElaF9R2lmeBmf9J
      name: Combine Harvester Array
