      system:
          description: Determines creature size and benefits.
          level: 6
          source: PG 139 CB
    - _id: PjGyS7wQBJbX7tfy
      name: Enhanced Motive Systems
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The vehicle has some way of gaining extra speed out of its engines,
              either via an enhanced form of promethium, ancient xeno-technology, or even
              a squig fuel injector. Vehicles with the Enhanced Motive Systems trait can
              move up to twice their Tactical Speed as a Half-Action rather than a Full
              Action, and can up to move three times their Tactical Speed as a Full Action.
              This applies to the Floor It! action as well, where vehicles with this trait
              move triple rather than double their Tactical Speed for the Full Action,
              and the Operate test for this action is treated as Ordinary (+10) rather
              than Difficult (-10).
          level: 0
          source: PG 188 CB
    - _id: MLvqCleaIOquCbOs
      name: Open-Topped
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The vehicle's passenger or crew compartments are not sealed and
              are instead exposed to the open air around them. This limits their protection,
              but it does allow transported troops to fire their own weapons as the vehicle
              moves. Crew and passengers mounted on an Open-topped vehicle can be specifically
              targeted by those outside the vehicle via the use of the Called Shot action.
              Additionally, passengers mounted in Open-Topped vehicles are struck by any
              Blast or Spray attacks of which they are in range. Crew and passengers within
              an Open-topped can attack targets with their own personal weaponry.
          level: 0
          source: PG 188 CB
    - _id: J6sjS6a22AtFxcXQ
      name: Walker
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The following rules apply to a vehicle with the Walker trait.
              It is able to ignore many types of difficult terrain due to its sure-footed
              and agile limbs. It treats conditions such as rockslides, tank traps, fallen
              trees, and basic rubble and ruins as open ground. It is up to the GM to determine
              what other types of terrain a walker can ignore. It cannot make use of the
              Ram! action, but if it has a melee weapon, it can make a Charge action (using
              the operator's Weapon Skill) instead. Far more combat capable than most other
              vehicle types, a walker (or rather its pilot) is better able to turn to face
              its opponents in the midst of a melee. It can turn to face its melee opponents
              at the end of its turn as a Free Action (this does not count as a form of
              movement). It should be clear to the GM and the players which direction it
              is facing for the purposes of working out which armour value its opponents
              must attempt to penetrate, as well as which direction the walker may make
              its attacks. It may turn as many times as it likes when moving, regardless
              of how far it moves.
          level: 0
          source: PG 189 CB
    - _id: LJHABcjvRgNyvg23
      name: Armoured Sentinel
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Some Sentinels sacrifice speed in favour of an enclosed cockpit
              and heavier armaments. An Armoured Sentinel increases its Front armour to
              25, loses the Enhanced Motive Systems vehicle trait, but gains the Enclosed
              vehicle trait.
          level: 0
          source: PG 56 EO
    - _id: Vmeee2PQixrLyba7
      name: Powerlifter
