        critical: 0
    size: 6
    faction: ''
    subfaction: ''
    type: Wheeled
    threatLevel: 18
items:
    - _id: imQ0qyEvexNnk0M4
      name: Size
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Determines creature size and benefits.
          level: 6
          source: PG 139 CB
    - _id: UyNGDXbgd7KpXjoS
      name: Enhanced Motive Systems
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The vehicle has some way of gaining extra speed out of its engines,
              either via an enhanced form of promethium, ancient xeno-technology, or even
              a squig fuel injector. Vehicles with the Enhanced Motive Systems trait can
              move up to twice their Tactical Speed as a Half-Action rather than a Full
              Action, and can up to move three times their Tactical Speed as a Full Action.
              This applies to the Floor It! action as well, where vehicles with this trait
              move triple rather than double their Tactical Speed for the Full Action,
              and the Operate test for this action is treated as Ordinary (+10) rather
              than Difficult (-10).
          level: 0
          source: PG 188 CB
    - _id: P5IWLrIrc4u41d7i
      name: Open-Topped
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The vehicle's passenger or crew compartments are not sealed and
              are instead exposed to the open air around them. This limits their protection,
              but it does allow transported troops to fire their own weapons as the vehicle
              moves. Crew and passengers mounted on an Open-topped vehicle can be specifically
              targeted by those outside the vehicle via the use of the Called Shot action.
              Additionally, passengers mounted in Open-Topped vehicles are struck by any
              Blast or Spray attacks of which they are in range. Crew and passengers within
              an Open-topped can attack targets with their own personal weaponry.
          level: 0
          source: PG 188 CB
    - _id: 2R8jGXLQPcPJFsbj
      name: Wheeled
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: The following rules apply to a Wheeled vehicle. It suffers a -20
              penalty to all tests involving difficult terrain. It gains a +10 bonus on
              all tests involving Manoeuvrability. Wheeled Vehicles are extremely difficult
              to control once they suffer serious damage to their motive systems; the loss
              of even one wheel can make even the most experienced drivers struggle to keep
              the vehicle moving in a straight line, especially in the heat of combat. Vehicles
              with the Wheeled Vehicle trait suffer Motive Systems Critical damage as normal,
              but once any such damage has been taken, all forms of movement require Operate
              tests, and all tests related to the vehicle's Manoeuvrability, are made at
              a -10 penalty. Wheeled mechanisms are generally far less complex than those
              belonging to tracked vehicles. Repairing Critical damage to the vehicle's
              Motive Systems, as well as any lasting Motive System damage (such as Motive
              Systems Damaged, Motive Systems Crippled, etc.) takes half as long as normal
              (see page 259).
          level: 0
          source: PG 189 CB
    - _id: 45jTSkjcQadpYwht
      name: Shielded Cargo
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: Wildcat buggies in service to Faceless Traders often feature special
              hidden storage areas coated or glazed with a substance that confuses prying
              scanners. Anyone attempting to scan for shielded cargo suffers a -30 penalty
              to that test. A Wildcat with such shielded cargo has an Availability of Very
              Rare (instead of Rare).
          level: 0
          source: PG 57 EO
    - _id: N7ITxKLUkX0vyOYx
      name: Speed Booster
      type: trait
      img: systems/dark-heresy-2nd/icons/talents/blue/b_33.png
      system:
          description: In addition to its already formidable speed, all Wildcats come
              equipped with a capacitor coil capable of overcharging the vehicle's engine
              for a short period of time. As a Half Action, the driver may activate the
              booster. For the next six rounds (30 seconds), the Wildcat's Cruising Speed
              and Tactical Speed increase to 120 kph and 15m, respectively, and the Wildcat's
              Manoeuvrability becomes -20. After use, the capacitor takes 1 hour to recharge,
              during which time it cannot be used again.
          level: 0
          source: PG 57 EO
    - _id: 2U8rtKk4EI3t2zID
