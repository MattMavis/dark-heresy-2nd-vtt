data:
    description: >-
        The character has an abiding fear and loathing of corpses and the dead,
        and can't stand to be around them for any length of time. Perhaps this
        is because they sometimes refuse to stay dead, or have inhabited their
        flesh...
    source: PG 288 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/fear-of-the-dead.webp'
name: Fear of the Dead
type: mentalDisorder
---
data:
    description: >-
        Scuttling, carapaced things with many legs are the stuff of this
        character's waking nightmares: faceless, numberless, and hungry, forever
        hungry.
    source: PG 288 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/fear-of-insects.webp'
name: Fear of Insects
type: mentalDisorder
---
data:
    description: >-
        A character compulsively steals small objects if they have the opportunity.
        Often the character attaches no value to the items, they just feel the
        need to steal them.
    source: PG 288 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/kleptomania.webp'
name: Kleptomania
type: mentalDisorder
---
data:
    description: >-
        The character feels the need to scourge and whip their flesh on a regular
        basis in order to purge away the sin of their actions through pain. This
        may be tied to a particular event, such as killing or thinking impure
        thoughts.
    source: PG 288 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/self-mortification.webp'
name: Self-Mortification
type: mentalDisorder
---
data:
    description: >-
        The character blames the limitations of their own body for their failures
        and problems. They become increasingly obsessed with surgical
        modification and bionic replacement.
    source: PG 288 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/the-flesh-is-weak.webp'
name: The Flesh is Weak
type: mentalDisorder
---
data:
    description: >-
        The character hears the voice of an old, now long-dead, perhaps a fellow
        Acolyte that they were unable to save or who sacrificed their life for the
        character. At a Severe level they may even have visions of their friend, or
        converse with them if their condition becomes Acute.
    source: PG 289 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/dead-acolyte.webp'
name: Dead Acolyte
type: mentalDisorder
---
data:
    description: >-
        The character relives traumatic moments from their life, often harkening
        back to a particularly vicious or harrowing battle with foul cultists.
        The length and vividness of these episodes varies according to the
        seriousness of their condition.
    source: PG 289 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/flashbacks.webp'
name: Flashbacks
type: mentalDisorder
---
data:
    description: >-
        The character believes that they will never get severely injured, possibly
        through luck or divine providence. Such a character would have to pass a
        Willpower test to avoid taking a vastly superior force instead of
        exercising due caution.
    source: PG 289 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/invulnerability.webp'
name: Invulnerability
type: mentalDisorder
---
data:
    description: >-
        The character believes that their choices are right and justified, no
        matter the cost. Such a character may callously and needlessly send
        allies to their deaths in the pursuit of a failing attack plan, even
        when the evidence for a change in tactics is necessary becomes
        overwhelming.
    source: PG 289 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/righteousness.webp'
name: Righteousness
type: mentalDisorder
---
data:
    description: >-
        The character suffers from vivid and recurring nightmares, like
        imagining the outcome of a failed Gellar Field, or being vivisected by
        masked men while paralysed and helpless. After any stressful day, they
        must pass a Willpower test in order to not succumb to the terrors while
        asleep. If they fail, they suffer 1 level of Fatigue (see page 233) on the
        following day.
    source: PG 289 CB
img: 'systems/dark-heresy-2nd/icons/gen/mental-disorders/horrific-nightmares.webp'
name: Horrific Nightmares
type: mentalDisorder
