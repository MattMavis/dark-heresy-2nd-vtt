    cost: 200
    damage: 0
    damageType: 'Energy'
    discipline: Biomancy
    description: 'The psyker chooses themselves or an organic target that they can physically
        touch. The targets physical appearance changes to a new form of the psykers choosing
        for the duration of the power. The amount and precision of the alterations depend
        on the final psy rating used. Following are some broad guidelines, but GMs can
        further alter the range of the power as needed.  PR 1-3: The psyker can alter subtle
        flesh shapes, tones, and colours to distort the appearance of the target. They do
        not have direct control over what the end result looks like.  PR 4-6: The psyker
        can alter flesh, hair, eyes, and any other physical features. They can choose how
        the features will be altered, but does not have the precision to mimic others.  PR
        7-9: The psyker can change any physical feature of the target to resemble another
        individual. However, the psyker must have a pic record of the individual, or have
        seen them before.  PR 10+: The psyker can shape their target to exactly mimic another
        individual. Additionally, they can use the power to morph the target into a form
        that no longer appears human. All tests to identify the targets true identity
        suffer a penalty equal to [[5*@pr]] for the duration of the power. The effects of
        the power on a target other than the psyker remain in effect for the duration
        of the power, regardless of how far away from the psyker the target becomes.'
    penetration: 0
    prerequisite: Per 35, T 30, Smite
    range: '1'
    source: DH2 202
    special: {}
    action: Full Action
    subtype: Concentration
    sustained: Free Action
    target:
        bonus: 10
        characteristic: willpower
