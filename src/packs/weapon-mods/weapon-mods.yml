    description: Working the unguents onto armour takes roughly one hour, and empties
        one container for each hit location treated. As part of the process, careful
        rituals must also be performed to inscribe runes and litanies into the armour.
        This requires a Hard (20) Scholastic Lore (Occult) or Forbidden Lore (Imperial
        Creed) test for each location; failure means the unguents must be cleaned off
        that location and the ritual started again. For each hit location treated with
        Unguents of Warding, the armour grants its wearer a +5 bonus to tests to resist
        Fear caused by characters with the Daemonic trait and to resist psychic powers.
        The effects of the unguents last for one month (or less due to wear and tear or
        contamination, at the GM's discretion).
