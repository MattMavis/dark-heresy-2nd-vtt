data:
    availability: Rare
    craftsmanship: Common
    description: >-
        As a Half Action, the wearer may make a Challenging (+0) Awareness test to
        detect psykers and characters with the Daemonic trait without the need for
        normal lighting until the end of the encounter. While these targets are
        illuminated in this way, the wearer gains a +10 bonus to his Ballistic Skill
        tests against them. The psyocculum distorts standard vision, however, imposing
        a 20 penalty to all other sight-based tests made while it is used. It also
        cannot be used at the same time as another piece of headgear, such as a helmet,
        and requires a Half Action to both put on or take off. Using a psyocculum
        causes the wearer to gain one level of Fatigue for every 5 minutes of operation
        beyond the first minute.
    source: PG 47 EB
    conditionalBonuses:
        - key: ballisticSkill
          value: 10
          condition: against psykers and Daemonic targets it has illuminated
    weight: 1.5
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Psyocculum
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Daemonic Remnant. The desiccated remains of banished Daemons—grey and porous,
        it seems to constantly generate heat but crumbles to ash when touched. Genuine
        Balestone can only be found in areas of recent daemonic incursion or recent
        summoning sites, and needs to be stored in stasis, as the unclean heat it emits
        eventually destroys any container. Any ritual to summon Daemons gains a +30
        bonus when enacted within a circle or symbol of Chaos composed of Balestone.
        Coating a weapon with Balestone grants it the Overheats and Tainted weapon
        qualities, and permanently removes the Sanctified quality, while covering skin
        with it grants the Daemonic (X) trait for X minutes, where X equals half the
        character's Willpower bonus. Any character who uses Balestone gains 1d10
        Corruption points per minute of exposure, and suffers a 20 penalty to any
        resulting Malignancy and Mutation tests. Balestone could also be used for
        increasing the power of Malefic psychic powers, or to heighten the chances or
        effects of Psychic Phenomena.
    source: PG 48 EB
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Balestone
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Daemonic Remnant. A legendary object said to predate Imperial Compliance,
        reported as a series of bells surrounded by rotted parchments; towns visited by
        the Carillon usually succumb to famine, disease, and a form of obsessive
        madness. A character must take a Willpower test at the end of every hour of
        exposure to the Carillon, with a 10 penalty for each day the Carillon has been
        present, gaining 1 Insanity point for every degree of failure. Mental disorders
        gained from the Carillon are always Obsession/Compulsion disorders focused
        around cataloguing innocuous and unrelated items. A cloud of smog with a radius
        of 20 metres surrounds it, which increases by 5 metres per day; any living
        creature within suffers the effects of suffocation after 30 minutes of exposure
        regardless of sealed armour/breathing apparatus. The cursed bells can
        alternatively be the source of quavering breaches in reality or even befoul
        Gellar Fields into puddles of tainted energies.
    source: PG 48 EB
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Cursed Carillon
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Daemonic Remnant. Supposedly ripped from the mouths of slain Flesh Hounds
        during the Seventh Cleansing of Juno, this misshapen collection of huge fangs
        arranged around a skeletal brass glove acts as a focusing tool that allows the
        user to locate and track people through the Warp, much like Flesh Hounds
        themselves. It grants a +30 bonus to any Navigate and Psyniscience tests, and
        Survival tests for the Tracking special use. Each time the character makes such
        a test, he gains 1d5 Corruption points, plus 1 additional Corruption point per
        degree of success on the test. The GM can have it turn on its wearer should he
        use it too much, sending packs of Flesh Hounds after him, or even turning
        inwards to devour his hand whole. In melee combat, the gauntlet acts as a sword
        and has the Tainted and Unwieldy weapon qualities.
    source: PG 48 EB
    weight: 0
