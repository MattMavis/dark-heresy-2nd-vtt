data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. A servo-skull that may in fact be possessed by a daemonic entity. Its
        "owner" gains a +30 bonus to Tech-Use tests, added at the GM's discretion, especially
        when success might have terrible or perverse consequences. The Animus Skull counts as
        having a Willpower of 60, and can be ordered to grant this bonus on command via an
        Opposed Hard (-20) Willpower test. If the owner fails this test, he gains 1 Corruption
        point and suffers 1 point of Intelligence damage per degree of failure on the test. The
        skull delights in other actions that cause death and destruction, such as corrupting
        other machine spirits to its bidding, or abruptly deactivating life-support or engines
        in vehicles.
    source: PG 52 EI
    conditionalBonuses:
        - key: techUse
          value: 30
          condition: when the skull consents, at the GM's discretion
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Animus Skull
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. The desecrated remains of a holy relic from the shrine world of
        Ossuar. If a bone suitable for combat is used to attack, it counts as a power axe;
        the user does not need a Weapon Training talent to wield it without penalty and adds
        twice his Corruption bonus to the damage inflicted. The owner gains the Enemy
        (Adeptus Ministorum) (5) talent, and members of that organisation (or others at the
        GM's discretion) gain the Hatred talent when fighting him. Smaller bones could also
        be used to aid in dark rites, daemonic summonings or bindings, or even act as
        protection against holy weapons and psychic attacks.
    source: PG 52 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Bones of Cardinal Cassille
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. Eight ivory-coloured candles that can only be lit after the wicks
        are dipped in the fresh blood of the owner. Lighting the candles does not require
        fresh blood, though the user is encouraged to perform similar obscene rites when
        setting each aflame. A user who does this gains 1d10 Corruption points, and an
        additional 1d10 points if he did not have Corruption prior to the candles' use. When
        all eight are lit, they grant a +30 bonus to any activities within 9 metres that draw
        upon the Warp for power, and creatures in that range with the Warp Instability trait
        lose this trait while they remain in the affected area. The candles can have other
        effects as well, such as increasing the chances for Psychic Phenomena, causing the
        results from psychic powers to vary wildly, or even causing Sanctified items to grow
        listless and ineffective as the unholy light from the candles burns reality itself.
    source: PG 53 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Candles of Ending
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. A thick metal sigil of the Imperium, its surface increasingly
        encrusted with a dark red film. If this cursed item is within 3 metres of an event
        calling for Psychic Phenomena, the event instead automatically triggers a roll on
        Table 6-3: Perils of the Warp (see page 197 of the Dark Heresy Core Rulebook);
        whoever is nearest the object counts as the triggering psyker, if needed. Each
        character who witnesses the event gains a number of Corruption points equal to his
        Fate threshold. The item seems to bring ill-favour to those following the Imperial
        Creed, perhaps depressing the number of Fate points available for those loyal to the
        Emperor, or twisting Fate point usage into results that inflict horrific outcomes.
        Each translation into the Warp should be a horrific event if the Aquila is aboard,
        with flickering Gellar fields and cracking hull plates.
    source: PG 53 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Carmine Aquila
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. An ornate metallic cup covered with elaborate filigree, whose waters
        are said to be the tears of redeemed heretics. He who dares to drink from the
        chalice must spend a Half Action to make a Very Hard (-30) Willpower test, followed
        by a Challenging (+0) Corruption test. He removes an amount of damage equal to the
        sum of the degrees of success from these tests or can remove 1 point of Critical
        damage, but also gains 1 Corruption point for each point of any type of damage
        removed. Otherwise, he is overcome by the unnatural liquids and gains 1 Corruption
        point for each degree of failure suffered from the two tests; on three or more
        degrees of failure, he also triggers a roll on Table 6-2: Psychic Phenomena (see
        page 196 of the Dark Heresy Core Rulebook) and adds ten times the degrees of failure
        to the result.
    source: PG 53 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Chalice of Tears
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. An eight-sided icon of spiked metal resembling other marks of Chaos,
        with a fleshy, closed eye at its centre. The correct rituals required to open the
        eye require a Very Hard (-30) Forbidden Lore (Daemonology) test. For every degree of
        success, the user gains 2 Corruption points; for every degree of failure, he gains 2
        Insanity points. Once opened, raw Warp energies rush through the icon and through
        its wielder for 1d10 rounds; any psychic power he manifests during that time counts
        as being used at twice the effective psy rating. A power strengthened this way
        always generates Psychic Phenomena, with a bonus to the roll equal to twice the
        effective psy rating the psyker chose. Even unopened, the icon is a powerful item,
        and can easily sway those who follow the Dark Gods to the side of its user or ignite
        a cult into violent uprising.
    source: PG 54 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Eye of Chaos
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. A legendary fragment said to be all that remains of House Dane's
        holdings, reportedly ranging in size from as large as a Baneblade to as small as a
        coin held in a stasis chamber. Cultists that believe they are either fighting for,
        or in defence of, the stone gain the Fearless talent and the Hatred talent for
        anyone—including rival cultists—attempting to take the stone (or what they think is
        the stone) away from them. Psykers could perhaps use the stone to gain visions from
        Askellon's founding, though attempts to comprehend the titanic struggles of those
        eras could inflict Insanity points or worse.
    source: PG 54 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Foundation Stone of House Dane
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. A legendary hammer said to have destroyed enemy warlords in the
        hands of cult leaders or firebrand military commanders. Any character using the
        Hammer gains the Frenzy talent and a +5 bonus to Weapon Skill tests for each other
        friendly character within 8 metres, but each of those allies suffers a -5 penalty to
        Weapon Skill tests. The Hammer itself counts as a Best craftsmanship power fist with
        the Concussive (3) and Tearing qualities. At the end of combat, each other friendly
        character within 8 metres suffers one level of Fatigue and the user suffers +1d5
        Corruption points for each adversary he killed using the Hammer.
    source: PG 54 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Hammer of Saint Lucillius
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. A four-volume tome, each dedicated to a specific Chaos God. Reading
        the Libris requires three ranks in either the Forbidden Lore (Daemonology) or
        Forbidden Lore (The Warp) skill. Acolytes can use the Libris Maleficarum when
        investigating various aspects of Chaos, represented by further bonuses to later
        Forbidden Lore tests, or tests to resist the influence of the daemonic or the
        profane (the GM has the final say on the exact nature of the bonuses). A character
        gains 1d5 Corruption points for each hour spent studying the horrid books. The GM can
        use the Craftsmanship ratings to represent different versions: Poor books are
        scarcely legible scrawls with no real understanding of the original text—the
        Acolytes never gain Corruption points for reading them, but research should take at
        least twice as long and offer very limited benefits. Common is a typical modern copy
        of a copy, with annotations and additions by a twisted author. Good retains most of
        Inquisitor Belenos' original text, and Acolytes need only Linguistics (High Gothic)
        to study it. Best clearly bears the marks of the daemonic—simply being near it sends
        strange whispers into the Acolytes' heads—and an Acolyte also gains 1 Insanity point
        for each Corruption point he gains as a result of reading this version.
    source: PG 55 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Libris Maleficarum
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. A dataslate-sized music box, said to originate from the workshops of
        Baron Michellius Madani, that plays a single piece of music. As long as the user
        keeps playing the music box, everyone except the operator cannot leave the area or
        even turn away from the box's user without first passing an Arduous (-40) Willpower
        test. Additionally, those that fail the test suffer an Addiction (see page 173 of the
        Dark Heresy Core Rulebook) to the music box, where the afflicted character gains 1d5
        Insanity points each day he goes without hearing the music. GMs might want to inflict
        Insanity depending on the size of the enraptured crowds, or even have a user gain
        Corruption points as each note takes something away from his soul.
    source: PG 56 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Madani's Music Box
type: gear
---
data:
    availability: Near Unique
    craftsmanship: Common
    description: >-
        Profane Object. One of six busts of Juno's most powerful leaders, sculpted by the
        master artificer Vocram from hand-quarried Desoleum quartz. A character who owns one
        of the Effigies may use it to cleanse the taint from his soul, but at the price of
        his sanity. After staring with total concentration at the disturbing marble for at
        least an hour, he can remove any number of Corruption points. For each point removed,
        however, he suffers the same amount of Willpower damage, and gains twice that number
        of Insanity points. After each use he must roll on Table 8-15: Malignancies; should
        he gain a Malignancy he already possesses, he then gains an additional 1d10 Insanity
        points instead. The GM can also impose an Addiction to the statue; its ownership
        could become a source of jealous friction within the warband, or it could inflict
        horrific facial deformities if used to remove too much Corruption.
    source: PG 56 EI
    weight: 0
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Vocram's Effigies
type: gear
---
data:
    availability: Very Rare
    craftsmanship: Common
    description: >-
        Psykers within 5 metres of one or more banishing rods cannot push their psychic
        powers, and reduce the result of any rolls they make on Table 6-2: Psychic
        Phenomena by 20 (to a minimum of 1). Characters with the Daemonic trait treat
        this area as a treacherous environment. When used in an exorcism, each rod
        placed around the target of the exorcism grants a +5 bonus to the Daemonic
        Mastery of the exorcism.
    source: PG 47 EB
    weight: 8
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Banishing Rod
