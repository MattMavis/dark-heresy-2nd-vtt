data:
    availability: Very Rare
    craftsmanship: Common
    description: >-
        A brain mine must be attached to an enemy through a successful Grapple action
        in melee combat. At the start of his turn for the following 3 rounds, the
        target must make a Hard (20) Agility test. If successful, he can perform a Half
        Action; otherwise he is unable to perform any actions, including Reactions,
        that round. The mine deals 1d10+5 Rending damage that is not reduced by armour
        if forcibly removed, but after 3 rounds, it burns out and dislodges from the
        target.
    source: PG 47 EB
    weight: 1
img: systems/dark-heresy-2nd/icons/talents/red/gr_08.png
name: Empyrean Brain Mine
